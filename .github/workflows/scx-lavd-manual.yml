name: SCX-LAVD Manual Build v2

on: [workflow_dispatch]

jobs:
  build:
    name: Build SCX-LAVD TEST arm64 module
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout module repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            libelf-dev \
            libz-dev \
            libzstd-dev \
            pkg-config \
            libssl-dev \
            git \
            zip \
            file \
            curl

      - name: Install Rust, Zig, and cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-unknown-linux-musl

          ZIG_VERSION="0.13.0"
          curl -L --retry 3 \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" \
            -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

          cargo install cargo-zigbuild --locked

      - name: Clone sched-ext source
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive --depth=1 \
            --branch "main" \
            https://github.com/sched-ext/scx.git scx

          cd scx
          git rev-parse HEAD | tee ../SCX_COMMIT.txt
          git submodule update --init --recursive

      - name: Build static Android-arm64 SCX-LAVD binary
        shell: bash
        run: |
          set -euo pipefail
          cd scx

          export CC_aarch64_unknown_linux_musl="zig cc -target aarch64-linux-musl"
          export CXX_aarch64_unknown_linux_musl="zig c++ -target aarch64-linux-musl"
          export AR_aarch64_unknown_linux_musl="zig ar"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="zig cc -target aarch64-linux-musl"
          export RUSTFLAGS="-C target-feature=+crt-static"

          cargo zigbuild \
            --release \
            --target aarch64-unknown-linux-musl \
            -p scx_lavd

          BIN="$(find target/aarch64-unknown-linux-musl/release -maxdepth 1 -type f -name scx_lavd | head -n1)"

          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "ERROR: scx_lavd arm64 binary was not produced"
            find target -type f -name '*lavd*' -print 2>/dev/null || true
            exit 1
          fi

          file "$BIN"
          cp "$BIN" "$GITHUB_WORKSPACE/scx_lavd"

      - name: Create KernelSU test module
        shell: bash
        run: |
          set -euo pipefail

          MOD="$GITHUB_WORKSPACE/module"
          mkdir -p "$MOD/system/bin"

          cp "$GITHUB_WORKSPACE/scx_lavd" "$MOD/system/bin/scx_lavd"
          chmod 0755 "$MOD/system/bin/scx_lavd"

          SCX_COMMIT="$(cat "$GITHUB_WORKSPACE/SCX_COMMIT.txt")"

          cat > "$MOD/module.prop" <<EOF
id=scx_lavd_test
name=SCX-LAVD-TEST (Android arm64)
version=0.1-experimental
versionCode=1
author=hafizhasant
description=EXPERIMENTAL sched_ext scx_lavd test module. Reboot or disable module to return to normal OPlus scheduling.
updateJson=
EOF

          cat > "$MOD/service.sh" <<'SH'
#!/system/bin/sh

MODDIR="${0%/*}"
BIN="$MODDIR/system/bin/scx_lavd"
LOG="/data/adb/scx_lavd_test.log"
PIDFILE="/data/adb/scx_lavd_test.pid"

log() {
  echo "$(date '+%F %T') $*" >> "$LOG"
}

log "===== SCX-LAVD-TEST service start ====="

until [ "$(getprop sys.boot_completed)" = "1" ]; do
  sleep 2
done

sleep 20

if [ ! -x "$BIN" ]; then
  log "ERROR: scx_lavd binary is missing or not executable"
  exit 0
fi

if [ ! -d /sys/kernel/sched_ext ]; then
  log "ERROR: sched_ext runtime interface is missing"
  exit 0
fi

if [ ! -d /sys/fs/bpf ]; then
  log "ERROR: bpffs is not mounted"
  exit 0
fi

log "sched_ext before start: $(cat /sys/kernel/sched_ext/state 2>/dev/null)"

for policy in /sys/devices/system/cpu/cpufreq/policy*; do
  if [ -w "$policy/scaling_governor" ]; then
    echo schedutil > "$policy/scaling_governor" 2>/dev/null
    log "$(basename "$policy") governor: $(cat "$policy/scaling_governor" 2>/dev/null)"
  fi
done

"$BIN" >> "$LOG" 2>&1 &
echo $! > "$PIDFILE"

sleep 5

log "scx_lavd PID: $(cat "$PIDFILE" 2>/dev/null)"
log "sched_ext after start: $(cat /sys/kernel/sched_ext/state 2>/dev/null)"
log "sched_ext rejected: $(cat /sys/kernel/sched_ext/nr_rejected 2>/dev/null)"

if [ "$(cat /sys/kernel/sched_ext/state 2>/dev/null)" != "enabled" ]; then
  log "ERROR: scx_lavd did not enable sched_ext; stopping it and restoring WALT"
  kill "$(cat "$PIDFILE" 2>/dev/null)" 2>/dev/null || true
  rm -f "$PIDFILE"

  for policy in /sys/devices/system/cpu/cpufreq/policy*; do
    if [ -w "$policy/scaling_governor" ]; then
      echo walt > "$policy/scaling_governor" 2>/dev/null || true
      log "$(basename "$policy") restored: $(cat "$policy/scaling_governor" 2>/dev/null)"
    fi
  done
  exit 0
fi

log "SUCCESS: scx_lavd is active with schedutil selected"
SH
          chmod 0755 "$MOD/service.sh"

          cat > "$MOD/uninstall.sh" <<'SH'
#!/system/bin/sh

PIDFILE="/data/adb/scx_lavd_test.pid"

if [ -f "$PIDFILE" ]; then
  kill "$(cat "$PIDFILE")" 2>/dev/null || true
  rm -f "$PIDFILE"
fi

rm -f /data/adb/scx_lavd_test.log
SH
          chmod 0755 "$MOD/uninstall.sh"

          cat > "$MOD/action.sh" <<'SH'
#!/system/bin/sh

echo "===== SCX-LAVD-TEST status ====="
echo "sched_ext state: $(cat /sys/kernel/sched_ext/state 2>/dev/null)"
echo "rejected: $(cat /sys/kernel/sched_ext/nr_rejected 2>/dev/null)"
echo "switch_all: $(cat /sys/kernel/sched_ext/switch_all 2>/dev/null)"
echo

for policy in /sys/devices/system/cpu/cpufreq/policy*; do
  echo "$(basename "$policy"): $(cat "$policy/scaling_governor" 2>/dev/null)"
done

echo
echo "===== Last module log lines ====="
tail -n 50 /data/adb/scx_lavd_test.log 2>/dev/null || true
SH
          chmod 0755 "$MOD/action.sh"

          cat > "$MOD/README.txt" <<EOF
SCX-LAVD-TEST
==============

This is an experimental KernelSU module for an arm64 kernel with:
  CONFIG_SCHED_CLASS_EXT=y
  CONFIG_BPF=y
  CONFIG_BPF_SYSCALL=y
  CONFIG_DEBUG_INFO_BTF=y

At completed Android boot, service.sh:
  1. switches CPU policies to schedutil
  2. starts scx_lavd
  3. writes logs to /data/adb/scx_lavd_test.log

Recovery:
  - Reboot if the scheduler test behaves badly.
  - Disable/remove this module in KernelSU.
  - Normal OPlus WALT startup policy returns after reboot without the module.

sched-ext/scx commit:
$SCX_COMMIT
EOF

          cd "$MOD"
          zip -r9 "$GITHUB_WORKSPACE/SCX-LAVD-TEST-arm64.zip" .

      - name: Upload test module artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCX-LAVD-TEST-arm64
          path: SCX-LAVD-TEST-arm64.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create prerelease
        if: github.ref == 'refs/heads/op15r-schedutil-default'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scx-lavd-test-${{ github.run_number }}
          name: SCX-LAVD-TEST ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: SCX-LAVD-TEST-arm64.zip
